name: Deploy site

# Builds willvinton.com plus Springspot AI (repo: whv3rd/Springboard, the old name) into one
# GitHub Pages site, with Springspot served at /springspot/. URLs under the earlier
# names (/springboard/, /springsboard/) get redirect pages to their new addresses.
# Requires: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up new Springspot posts (including ones scheduled by date) once a day.
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Branch of whv3rd/Springboard to publish. Override with the repo variable SPRINGSPOT_REF
  # (SPRINGBOARD_REF, its earlier name, is still read if it's set).
  SPRINGSPOT_REF: ${{ vars.SPRINGSPOT_REF || vars.SPRINGBOARD_REF || 'main' }}
  SPRINGSPOT_BASE: /springspot
  # Where the site lived under earlier names (space-separated); every page there
  # redirects to the same page under SPRINGSPOT_BASE.
  SPRINGSPOT_OLD_BASES: /springboard /springsboard
  # Google Tag Manager container, injected into every Springspot page.
  GTM_ID: ${{ vars.GTM_ID || 'GTM-W64VTKTX' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out willvinton.com
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out Springspot
        uses: actions/checkout@v4
        with:
          repository: whv3rd/Springboard
          ref: ${{ env.SPRINGSPOT_REF }}
          path: springspot

      - name: Confirm Springspot has a site to build
        run: |
          if [ ! -f springspot/package.json ]; then
            echo "::error::whv3rd/Springboard@${SPRINGSPOT_REF} has no package.json. Merge the site into that branch or set the SPRINGSPOT_REF repo variable."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: springspot/package-lock.json

      - name: Build Springspot
        working-directory: springspot
        env:
          # Klaviyo account "Springspot AI": public site key and the Email List the forms
          # subscribe to. Both are browser-safe. Repo variables override them.
          PUBLIC_KLAVIYO_SITE_KEY: ${{ vars.PUBLIC_KLAVIYO_SITE_KEY || 'TRKcd8' }}
          PUBLIC_KLAVIYO_LIST_ID: ${{ vars.PUBLIC_KLAVIYO_LIST_ID || 'Y3mKEK' }}
        run: |
          npm ci
          npx astro build --site https://www.willvinton.com --base "$SPRINGSPOT_BASE"
          node ../site/.github/scripts/prefix-base.mjs dist "$SPRINGSPOT_BASE"
          node ../site/.github/scripts/inject-gtm.mjs dist "$GTM_ID"
          # Internal design reference: keep it in `astro dev`, off the live site.
          rm -rf dist/styleguide

      - name: Assemble site
        run: |
          mkdir -p _site
          # Repo docs, tooling and willvinton.html (a copy of index.html for previews) stay off the site.
          rsync -a --exclude '.git' --exclude '.github' --exclude '/*.md' --exclude '/docs' \
            --exclude '/gtm' --exclude '/scripts' --exclude '/willvinton.html' site/ _site/
          mkdir -p "_site${SPRINGSPOT_BASE}"
          cp -R springspot/dist/. "_site${SPRINGSPOT_BASE}/"
          # shellcheck disable=SC2086 # split the list of old bases into arguments
          node site/.github/scripts/redirect-old-base.mjs _site "$SPRINGSPOT_BASE" https://www.willvinton.com $SPRINGSPOT_OLD_BASES

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
