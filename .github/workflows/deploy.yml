name: Deploy site

# Builds willvinton.com plus Springsboard AI (repo: whv3rd/Springboard) into one
# GitHub Pages site, with Springsboard served at /springsboard/. Old /springboard/
# URLs get redirect pages to their new addresses.
# Requires: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up new Springsboard posts (including ones scheduled by date) once a day.
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Branch of whv3rd/Springboard to publish. Override with the repo variable SPRINGBOARD_REF.
  SPRINGBOARD_REF: ${{ vars.SPRINGBOARD_REF || 'main' }}
  SPRINGBOARD_BASE: /springsboard
  # Where the site lived before the rename; every page there redirects to the new base.
  SPRINGBOARD_OLD_BASE: /springboard
  # Google Tag Manager container, injected into every Springsboard page.
  GTM_ID: ${{ vars.GTM_ID || 'GTM-W64VTKTX' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out willvinton.com
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out Springboard
        uses: actions/checkout@v4
        with:
          repository: whv3rd/Springboard
          ref: ${{ env.SPRINGBOARD_REF }}
          path: springboard

      - name: Confirm Springboard has a site to build
        run: |
          if [ ! -f springboard/package.json ]; then
            echo "::error::whv3rd/Springboard@${SPRINGBOARD_REF} has no package.json. Merge the site into that branch or set the SPRINGBOARD_REF repo variable."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: springboard/package-lock.json

      - name: Build Springboard
        working-directory: springboard
        env:
          PUBLIC_KLAVIYO_SITE_KEY: ${{ vars.PUBLIC_KLAVIYO_SITE_KEY }}
          PUBLIC_KLAVIYO_LIST_ID: ${{ vars.PUBLIC_KLAVIYO_LIST_ID }}
        run: |
          npm ci
          npx astro build --site https://www.willvinton.com --base "$SPRINGBOARD_BASE"
          node ../site/.github/scripts/prefix-base.mjs dist "$SPRINGBOARD_BASE"
          node ../site/.github/scripts/inject-gtm.mjs dist "$GTM_ID"
          # Internal design reference: keep it in `astro dev`, off the live site.
          rm -rf dist/styleguide

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' site/ _site/
          mkdir -p "_site${SPRINGBOARD_BASE}"
          cp -R springboard/dist/. "_site${SPRINGBOARD_BASE}/"
          node site/.github/scripts/redirect-old-base.mjs _site "$SPRINGBOARD_BASE" "$SPRINGBOARD_OLD_BASE" https://www.willvinton.com

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
